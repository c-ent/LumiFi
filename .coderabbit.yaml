language: "en-US"
tone_instructions: |
  Be concise, direct, and constructive.
reviews:
  profile: "assertive"
  # Review pull requests into dev as well as the default branch.
  auto_review:
    base_branches:
      - "main"
      - "master"
      - "dev"

  # Exclude specific files/directories from being reviewed
  path_filters:
    - "!.agents/**"

  path_instructions:
    - path: "src/**/*.ts"
      instructions: |
        Focus on architecture and system design.
        Prioritize scalability and
        long-term maintainability.
